<style>
  :root{
    --navy-deep:#050c1e;
    --navy:#0a1730;
    --navy-card:#0e1c38;
    --navy-card-border:#1c2c4d;
    --gold:#f2b93b;
    --gold-soft:#f7ce6f;
    --text-white:#ffffff;
    --text-muted:#b7c2da;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:var(--navy-deep);
    font-family:'Poppins',sans-serif;
    color:var(--text-white);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{text-decoration:none;color:inherit;}

  /* NAVBAR */
  header.nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 48px;
    background:var(--navy-deep);
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  nav.links{
    display:flex;
    gap:38px;
    font-size:15px;
    font-weight:500;
  }
  nav.links a{color:var(--text-white);transition:color .2s;}
  nav.links a.active{color:var(--gold);}
  nav.links a:hover{color:var(--gold-soft);}
  .nav-right{display:flex;align-items:center;gap:20px;}
  .whatsapp-icon{
    width:38px;height:38px;
    border-radius:50%;
    background:#25D366;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:transform .2s, box-shadow .2s;
  }
  .whatsapp-icon:hover{transform:translateY(-2px); box-shadow:0 8px 18px rgba(37,211,102,0.4);}
  .nav-left{
    display:flex;
    align-items:center;
    gap:44px;
  }
  .brand-logo{display:flex; align-items:center;}
  .brand-logo img{height:34px; width:auto; display:block;}
  .btn-gold{
    background:linear-gradient(135deg,var(--gold-soft),var(--gold));
    color:#1a1200;
    font-weight:700;
    font-size:14.5px;
    padding:12px 26px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .2s, box-shadow .2s;
  }
  .btn-gold:hover{transform:translateY(-2px); box-shadow:0 10px 25px rgba(242,185,59,0.35);}

  /* HERO */
  section.hero{
    position:relative;
    padding:90px 48px 120px;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 15%, rgba(242,185,59,0.08), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(242,185,59,0.05), transparent 45%),
      var(--navy-deep);
  }
  .hero-inner-simple{
    max-width:720px;
    margin:0 auto;
    text-align:center;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--gold-soft);
    font-weight:600;
    font-size:13px;
    letter-spacing:1.5px;
    margin-bottom:22px;
  }
  .tag svg{width:14px;height:14px;}
  h1.hero-title{
    font-size:52px;
    font-weight:800;
    line-height:1.1;
    margin-bottom:22px;
    letter-spacing:-1px;
  }
  p.hero-desc{
    color:var(--text-muted);
    font-size:16.5px;
    line-height:1.65;
    margin:0 auto 8px;
    max-width:480px;
  }
  .placeholder-box{
    margin-top:50px;
    border:1px dashed rgba(255,255,255,0.15);
    border-radius:16px;
    padding:60px 30px;
    color:var(--text-muted);
    background:rgba(15,26,52,0.5);
  }
  .placeholder-box p{font-size:15px;}
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:34px;
    font-size:14px;
    font-weight:500;
    color:var(--gold-soft);
  }
  .back-link:hover{color:var(--gold);}
  .back-link svg{width:14px;height:14px;transform:rotate(180deg);}

  @media (max-width:820px){
    header.nav{padding:16px 20px;}
    nav.links{display:none;}
    section.hero{padding:60px 20px 80px;}
    h1.hero-title{font-size:36px;}
  }
</style>
</head>
